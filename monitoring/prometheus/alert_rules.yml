groups:
  - name: incidentmind-service-health
    rules:
      - alert: HighApiErrorRate
        expr: >-
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (service) (rate(http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate for {{ $labels.service }}"
          description: "5xx response ratio has exceeded 5% for five minutes. Current ratio: {{ $value }}."

      - alert: HighApiLatency
        expr: >-
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API p95 latency for {{ $labels.service }}"
          description: "API p95 latency has exceeded one second for five minutes. Current latency: {{ $value }} seconds."

      - alert: DatabaseConnectionSaturation
        expr: >-
          sum by (instance) (pg_stat_activity_count)
          /
          clamp_min(max by (instance) (pg_settings_max_connections), 1)
          > 0.90
        for: 3m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection saturation on {{ $labels.instance }}"
          description: "Active PostgreSQL connections have exceeded 90% of max_connections for three minutes. Current ratio: {{ $value }}."
